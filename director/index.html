<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导演台 · 项目工作台</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">◆</span><span>导演台</span></div>
    <nav class="top-menu"><span>文件</span><span>窗口</span><span>帮助</span></nav>
    <div class="top-status"><span id="comfy-dot" class="status-dot off"></span><span id="comfy-label">ComfyUI 检查中</span></div>
    <button class="icon-button" id="btn-config" title="打开连接配置">⚙</button>
  </header>
  <div class="app-body">
    <aside class="sidebar">
      <div class="side-tools">
        <button class="side-action primary" id="btn-new-project"><span class="action-icon">＋</span><span>开始创作</span></button>
        <button class="side-action active" id="btn-project-library"><span class="action-icon">▱</span><span>项目库</span></button>
        <button class="side-action" id="btn-skill"><span class="action-icon">⌘</span><span>Skill</span></button>
        <button class="side-action" id="btn-comfy-flow"><span class="action-icon">⌘</span><span>ComfyUI 工作流 <em>Beta</em></span></button>
      </div>
      <div class="library-divider"></div>
      <div class="library-head"><span>项目</span><button class="small-icon" id="btn-refresh-projects" title="刷新项目">↻</button></div>
      <div class="project-library" id="project-library"><div class="library-loading">正在载入项目…</div></div>
      <div class="account"><div class="avatar">E</div><div><strong>EXALEX yang</strong><span>本地导演台</span></div><button class="small-icon" title="账户菜单">⋯</button></div>
    </aside>

    <main class="canvas-area">
      <div class="canvas-toolbar">
        <div class="breadcrumbs"><span id="canvas-project-name">项目</span><span class="crumb-arrow">›</span><strong id="canvas-episode-name">选择一集开始</strong></div>
        <div class="canvas-tools"><button class="small-icon" title="缩小">−</button><span>100%</span><button class="small-icon" title="放大">＋</button><button class="small-icon" title="显示缩略图">▦</button><button class="map-button">⌘ 小地图</button></div>
      </div>
      <section class="canvas-stage" id="canvas-stage"><div class="canvas-empty">选择左侧项目中的一集</div></section>
      <div class="canvas-dock"><button class="dock-add" title="添加内容">＋</button><button title="选择工具">➤</button><button title="收起工具">⌃</button><button title="打开素材文件夹">□</button><button title="帮助">?</button></div>
      <div class="watermark">导演台 · H3 short drama workspace</div>
    </main>

    <aside class="work-panel">
      <div class="panel-titlebar"><div class="panel-title-wrap"><span class="doc-icon">▤</span><div><strong id="right-project-title">未选择项目</strong><span id="right-episode-title">请选择集数</span></div></div><button class="small-icon" title="更多操作">⋯</button></div>
      <div class="plan-head"><div><span>制作计划</span><b id="plan-count">0/5</b><small id="plan-current">等待开始</small></div><span class="plan-state" id="plan-state">—</span></div>
      <div class="plan-list" id="plan-list"></div>
      <div class="conversation" id="conversation">
        <div class="conversation-toolbar"><span>对话</span><button class="small-icon" id="btn-clear-chat" title="清空对话">⌫</button></div>
        <div class="conversation-content" id="conversation-content"><div class="chat-placeholder">选择一个项目集数，开始查看制作内容。</div></div>
      </div>
      <div class="composer">
        <div class="composer-promo"><span class="promo-star">✦</span><strong>H3 视频工作台</strong><button class="small-icon" title="关闭提示">×</button></div>
        <textarea id="chat-input" rows="3" placeholder="输入故事创意，自动生成简案、资产、分镜和提示词…"></textarea>
        <div id="workflow-status" class="workflow-status" aria-live="polite"></div>
        <div class="composer-foot"><button class="round-add" title="添加文件">＋</button><span class="composer-divider"></span><button class="composer-tool">◇ 模型</button><span class="composer-divider"></span><button class="composer-tool">⌘ Skill</button><button class="send-button" id="btn-chat-send" title="发送">↑</button></div>
      </div>
    </aside>
  </div>
</div>

<div class="modal-mask" id="stage-mask"><section class="stage-modal" id="stage-modal"><div class="modal-head"><div><span id="modal-kicker">工作台</span><h2 id="modal-title">—</h2></div><button class="small-icon" id="modal-close" title="关闭">×</button></div><div class="modal-body" id="modal-body"></div></section></div>
<div class="modal-mask" id="new-mask"><section class="stage-modal compact-modal"><div class="modal-head"><div><span>开始创作</span><h2>新建项目</h2></div><button class="small-icon" id="new-close" title="关闭">×</button></div><div class="modal-body"><label class="form-label">项目名称<input id="new-name" placeholder="例如：我的短剧项目"></label><label class="form-label">项目模板<select id="new-template"><option value="blank">空白项目</option><option value="example">奥德赛示例</option></select></label><button class="primary-button full-button" id="new-create">创建项目</button></div></section></div>
<div class="modal-mask" id="config-mask"><section class="stage-modal compact-modal"><div class="modal-head"><div><span>连接</span><h2>运行配置</h2></div><button class="small-icon" id="config-close" title="关闭">×</button></div><div class="modal-body"><label class="form-label">ComfyUI 地址<input id="cfg-comfy" value="http://127.0.0.1:8188"></label><p class="form-note">5800H 只运行导演台；生成请求通过此地址连接局域网中的 ComfyUI。</p><button class="primary-button full-button" id="config-save">保存</button><div id="config-result" class="form-note"></div></div></section></div>
<div id="toast-wrap"></div>
<script src="/assets/app.js"></script>
</body>
</html>
